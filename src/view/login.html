<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Textured background */
        body {
            background: url('https://www.transparenttextures.com/patterns/connected.png'), linear-gradient(to right, #6a11cb, #2575fc);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Card styling */
        .card {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden; /* Prevents the image from overflowing */
        }

        /* Background logo styling */
        .card img.background-logo {
            position: absolute;
            top: 10px; /* Adjust as needed */
            right: 10px; /* Adjust as needed */
            width: 80px; /* Adjust size */
            opacity: 0.2; /* Adjust transparency */
            z-index: 0; /* Send to the back */
        }

        /* Form input spacing */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1; /* Bring form elements to the front */
        }

        /* Sign In & Register button styling */
        .btn-custom {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="card p-4">
        <img src="https://via.placeholder.com/80" alt="Project Logo" class="background-logo"> <!-- Replace with your logo -->
        <h3 class="text-center mb-4">Login</h3>
        <form>
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="abc@gmail.com">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="a1b2c3d4">
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-custom">Sign In</button>
            </div>
            <div class="form-group">
                <button type="button" class="btn btn-secondary btn-custom">Register</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('fetchDataBtn').addEventListener('click', async()=> {
            // var login = await axios.post('https://api.example.com/submit', {
            var login = await axios.post('localhost:8191/user/Login', {
                email: document.getElementById('username'),
                Password:  document.getElementById('password'),
            })
            if(login){
                console.log(login,`===========login successful`);                
            }
        });

        function toggleMask() {
            const passwordInput = document.getElementById("password");
            if (passwordInput.type === "password") {
                passwordInput.type = "text"; // Show text
            } else {
                passwordInput.type == "password"; // Revert to
            }
        }
    </script>
</body>
</html>
