    <style>
        /* Textured background */
        body {
            background: url('https://www.transparenttextures.com/patterns/connected.png'), linear-gradient(to right, #6a11cb, #2575fc);
            height: 100vh;
        }

        /* Card styling */
        .card {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            margin: 20px; /* Add some margin for spacing */
        }

        /* Accordion header styling */
        .accordion-header {
            background-color: rgba(0, 123, 255, 0.1); /* Light blue for accordion headers */
        }

        /* Sign In & Register button styling */
        .btn-custom {
            width: 100%;
        }
        .dropdown-menu::before {
            content: '';
            position: absolute;
            top: -10px; /* Position above the dropdown */
            right: 10px; /* Adjust this value to align the arrow */
            border-width: 0 8px 8px 8px;
            border-style: solid;
            border-color: transparent transparent #fff transparent;
        }

        /* Optional: Add a border to match the dropdown menu style */
        .dropdown-menu::after {
            content: '';
            position: absolute;
            top: -12px;
            right: 10px; /* Same as above for alignment */
            border-width: 0 10px 10px 10px;
            border-style: solid;
            border-color: transparent transparent rgba(0, 0, 0, 0.15) transparent;
        }
        .active{
            color: #ff0000;
            font-weight: bold;
        }
    </style>
</head>
