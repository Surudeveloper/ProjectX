<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Custom Styling for the page */
        body {
            background-color: #f1f4f8;
            font-family: Arial, sans-serif;
        }

        .settings-container {
            max-width: 800px;
            margin: 80px auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #343a40;
        }

        .scrollable-form {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 15px;
        }

        .form-control,
        .form-select {
            border-radius: 0.375rem;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #6c757d;
            box-shadow: none;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        /* Profile Picture */
        .profile-pic-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-pic-wrapper img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #6c757d;
        }

        .edit-profile-pic {
            position: relative;
            top: -40px;
            right: -60px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 50%;
            cursor: pointer;
        }

        .edit-profile-pic:hover {
            background-color: #0056b3;
        }

        .edit-profile-pic input {
            display: none;
        }

        /* Header Style (Similar to Landing Page) */
        .navbar {
            background-color: #343a40;
            padding: 10px;
        }

        .navbar-brand img {
            width: 40px;
            height: 40px;
        }

        .navbar a {
            color: white;
            margin-right: 20px;
        }

        .navbar a:hover {
            color: #adb5bd;
        }

        /* Media queries for responsive design */
        @media (max-width: 768px) {
            .settings-container {
                margin: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header (Same as Landing Page) -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://via.placeholder.com/40x40?text=Logo" alt="Logo"> WebApp
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a></li>
                </ul>
                <div class="dropdown">
                    <a class="user-logo text-white" href="#" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="https://via.placeholder.com/40x40?text=User" alt="User" class="rounded-circle me-2" width="30px" height="30px">
                        <span>Suresh Kumar</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person-circle me-2"></i> My Profile</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i> Settings</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Settings Form -->
    <div class="container settings-container">
        <h2>Update Your Settings</h2>

        <!-- Profile Picture Section -->
        <!-- <div class="profile-pic-wrapper">
            <img id="profile-pic" src="https://via.placeholder.com/150x150?text=User+DP" alt="Profile Picture">
            <button class="edit-profile-pic">
                <i class="bi bi-pencil-fill"></i>
                <input type="file" id="profile-pic-upload" accept="image/*" onchange="previewProfilePic(event)">
            </button>
        </div> -->
        <!-- <div class="profile-pic-wrapper position-relative">
            <img id="profile-pic" src="https://via.placeholder.com/150x150?text=User+DP" alt="Profile Picture" class="img-fluid rounded-circle">
            <button class="edit-profile-pic position-absolute bottom-0 end-0 translate-middle bg-primary text-white border-0 rounded-circle p-2">
                <i class="bi bi-pencil-fill"></i>
                <input type="file" id="profile-pic-upload" accept="image/*" onchange="previewProfilePic(event)" style="display: none;">
            </button>
        </div> -->
        <div class="profile-pic-wrapper">
            <img id="profile-pic" src="https://via.placeholder.com/150x150?text=User+DP" alt="Profile Picture">
            <button class="edit-profile-pic">
                <i class="bi bi-pencil-fill"></i>
                <input type="file" id="profile-pic-upload" accept="image/*" onchange="previewProfilePic(event)">
            </button>
        </div>

        <form class="scrollable-form">
            <!-- Name -->
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password">
            </div>

            <!-- Phone -->
            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <div class="input-group">
                    <select class="form-select" id="countryCode" style="max-width: 25%;">
                        <option selected disabled>+Code</option>
                        <option value="+91">+91 (India)</option>
                        <option value="+1">+1 (USA)</option>
                        <option value="+44">+44 (UK)</option>
                        <option value="+61">+61 (Australia)</option>
                    </select>
                    <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number">
                </div>
            </div>

            <!-- Role -->
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <input type="text" class="form-control" id="role" placeholder="Enter your role">
            </div>

            <!-- Manager -->
            <div class="mb-3">
                <label for="manager" class="form-label">Manager</label>
                <input type="text" class="form-control" id="manager" placeholder="Enter your manager's name">
            </div>

            <!-- Address -->
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" placeholder="Enter your address">
            </div>

            <!-- City -->
            <div class="mb-3">
                <label for="city" class="form-label">City</label>
                <input type="text" class="form-control" id="city" placeholder="Enter your city">
            </div>

            <!-- Pin -->
            <div class="mb-3">
                <label for="pin" class="form-label">Pin</label>
                <input type="text" class="form-control" id="pin" placeholder="Enter your pin">
            </div>

            <!-- State -->
            <div class="mb-3">
                <label for="state" class="form-label">State</label>
                <input type="text" class="form-control" id="state" placeholder="Enter your state">
            </div>

            <!-- Country -->
            <div class="mb-3">
                <label for="country" class="form-label">Country</label>
                <input type="text" class="form-control" id="country" placeholder="Enter your country">
            </div>

            <!-- Gender -->
            <div class="mb-3">
                <label for="gender" class="form-label">Gender</label>
                <select class="form-select" id="gender" required>
                    <option selected disabled>Select your gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Save Changes Button -->
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript to preview profile picture before upload -->
    <script>
        function previewProfilePic(event) {
            const input = event.target;
            const reader = new FileReader();

            reader.onload = function() {
                const img = document.getElementById('profile-pic');
                img.src = reader.result;
            };

            if (input.files && input.files[0]) {
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
